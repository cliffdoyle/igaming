# Apache hardening for the OntarioGamers WordPress container.
# Mounted read-only into /etc/apache2/conf-enabled/ by docker-compose.prod.yml.

# XML-RPC is not used by this site (no Jetpack / mobile app) and is the target
# of password brute-force floods. Deny it here so Apache answers 403 without
# starting PHP or WordPress.
<Files "xmlrpc.php">
    Require all denied
</Files>

# Visitors reach the origin through Cloudflare. Trust Cloudflare's proxies so
# mod_remoteip (enabled by the official image, header X-Forwarded-For) gives
# Apache logs and WordPress the real visitor IP instead of a Cloudflare IP.
# Source: https://www.cloudflare.com/ips/
RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
RemoteIPTrustedProxy 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
